<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiance Result Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ee;--card:#fffdf9;--ink:#1d2823;--muted:#7a8580;--line:#e8e2d8;
    --accent:#1f5c4d;--accent-soft:#e3eee8;--err:#b4412f;
    --serif:'Fraunces','Hind Siliguri',Georgia,serif;
    --sans:'Inter','Hind Siliguri',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#111614;--card:#192019;--ink:#eef2ee;--muted:#93a199;--line:#2a342e;
    --accent:#7fcdb0;--accent-soft:#1f2e28;--err:#e58c7a;
  }}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
    -webkit-font-smoothing:antialiased}
  svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .page{max-width:640px;margin:0 auto;padding:28px 20px 56px}
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
  .mark svg{font-size:16px}
  .brand b{font-family:var(--serif);font-size:1.3rem;font-weight:600;letter-spacing:.2px}
  .top small{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  .head{padding:44px 0 34px}
  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-family:var(--serif);font-weight:500;font-size:2.6rem;line-height:1.15;margin:12px 0 8px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:1.05rem;margin:0}

  .view{display:none;animation:fade .5s ease both}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .choice{width:100%;display:flex;align-items:center;gap:18px;text-align:left;padding:20px;margin-bottom:12px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer;color:var(--ink);font:inherit;transition:.25s}
  .choice:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(31,92,77,.45)}
  .ico{width:50px;height:50px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:24px}
  .choice .t{flex:1}
  .choice b{display:block;font-size:1.05rem;font-weight:600}
  .choice span.s{color:var(--muted);font-size:.9rem}
  .choice .go-arrow{color:var(--muted);font-size:20px;transition:.25s}
  .choice:hover .go-arrow{color:var(--accent);transform:translateX(4px)}

  .back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font:inherit;font-size:.92rem;cursor:pointer;padding:0;margin-bottom:26px}
  .back:hover{color:var(--accent)}

  .lbl{font-family:var(--serif);font-size:1.5rem;margin:0 0 16px;font-weight:500}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;transition:.2s}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .search svg{font-size:20px;color:var(--muted)}
  input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;letter-spacing:.04em;padding:12px 0}
  input::placeholder{color:var(--muted);opacity:.7}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;font-size:.95rem;padding:12px 20px;border-radius:12px;transition:.2s}
  .btn:hover{opacity:.9}
  #status{margin-top:12px;color:var(--err);font-size:.92rem;min-height:1.2em}

  #result{display:none;margin-top:26px;animation:fade .5s ease both}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .info{flex:1 1 220px}
  .info .tag{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .info h2{font-family:var(--serif);font-weight:500;font-size:1.9rem;line-height:1.2;margin:6px 0 18px}
  .meta{display:flex;align-items:flex-start;gap:10px;color:var(--ink);font-size:.98rem;margin-top:10px}
  .meta svg{font-size:18px;color:var(--accent);margin-top:3px}
  .ring{position:relative;width:150px;height:150px;margin:0 auto}
  .ring svg{width:150px;height:150px;transform:rotate(-90deg);stroke-width:7}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--accent);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .c b{font-family:var(--serif);font-size:2.4rem;font-weight:500;line-height:1}
  .ring .c span{font-size:.78rem;color:var(--muted);margin-top:4px;letter-spacing:.08em}

  .pages img{display:block;width:100%;height:auto;margin-bottom:16px;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:0 18px 40px -24px rgba(0,0,0,.3)}
  .foot{margin-top:40px;text-align:center;font-size:.76rem;color:var(--muted);letter-spacing:.06em}
  @media(max-width:480px){h1{font-size:2.1rem}.btn span{display:none}.btn{padding:12px 14px}.top small{display:none}}
</style>
<script>
const TOTAL = 60, CIRC = 326.7;
const DATA = {
  "01996202426": {name:"রোদমীলা মেহজাবিন",      college:"Tongi Govt",  marks:40},
  "01982353104": {name:"Oishi",                  college:"GCC",         marks:52},
  "01921744004": {name:"Payel Sarker",           college:"SSAC",        marks:52},
  "01911749187": {name:"Mehjabin Suraiya Moumi", college:"SSAC",        marks:41},
  "01896298308": {name:"Safria Nusrat",          college:"SSAC",        marks:36},
  "01648377872": {name:"Mahbuba",                college:"SSAC",        marks:37},
  "01783398136": {name:"Israt",                  college:"SSAC",        marks:31},
  "01332388822": {name:"Dip",                    college:"SSAC",        marks:23},
  "01778425325": {name:"Arshy",                  college:"SSAC",        marks:24},
  "01331053446": {name:"Jubayer",                college:"TGC",         marks:24},
  "01720224289": {name:"Najmun Nahar",           college:"SSAC",        marks:40},
  "01648492609": {name:"Shammi",                 college:"Uttara High", marks:41},
  "01943579106": {name:"Tasmia Tasnim",          college:"Shaheed Ramiz Uddin Cantonment College", marks:37}
};
function $(id){ return document.getElementById(id); }
function show(id){
  var v = document.querySelectorAll(".view");
  for (var i=0;i<v.length;i++){ v[i].classList.toggle("on", v[i].id === id); }
  window.scrollTo(0,0);
}
function normalize(s){
  s = s.replace(/[\u09E6-\u09EF]/g, function(d){ return String(d.charCodeAt(0) - 0x09E6); }).replace(/\D/g, "");
  if (s.indexOf("880") === 0) s = s.slice(2);
  if (s.length === 10 && s.charAt(0) === "1") s = "0" + s;
  return s;
}
function go(){
  var num = normalize($("num").value), d = DATA[num];
  $("result").style.display = "none"; $("fg").style.strokeDashoffset = CIRC;
  if (!d){
    $("status").textContent = num.length < 11 ? "সঠিক ১১ ডিজিটের phone number দিন।" : "এই নম্বরের কোনো result পাওয়া যায়নি।";
    return;
  }
  $("status").textContent = "";
  $("nm").textContent = d.name;
  $("cl").textContent = d.college;
  $("ph").textContent = num;
  $("mk").textContent = d.marks;
  $("result").style.display = "block";
  setTimeout(function(){ $("fg").style.strokeDashoffset = CIRC * (1 - d.marks / TOTAL); }, 120);
}
document.addEventListener("click", function(e){
  var t = e.target;
  if (!t.closest) return;
  if (t.closest("#c-sheet")) { show("v-sheet"); }
  else if (t.closest("#c-result")) { show("v-result"); setTimeout(function(){ var n=$("num"); if(n) n.focus(); }, 300); }
  else if (t.closest("[data-back]")) { show("v-home"); }
  else if (t.closest("#btn")) { go(); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.id === "num") go();
});
</script>
